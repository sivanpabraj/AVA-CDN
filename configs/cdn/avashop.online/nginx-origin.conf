# Origin config — place behind Cloudflare (Proxied)
# Germany server: 49.13.6.108

upstream xray_grpc {
    server xray:2096;
    keepalive 8;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name de.avashop.online avashop.online www.avashop.online cn.avashop.online;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ACME / Cloudflare origin cert challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # VLESS-gRPC CDN path
    location /grpc-avashop {
        grpc_pass grpc://xray_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
    }

    location / {
        return 200 "avashop-cdn-origin\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80 default_server;
    server_name _;
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
