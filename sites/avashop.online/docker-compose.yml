services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ava-avashop-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ava-avashop-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  xray:
    image: teddysun/xray:25.2.21
    container_name: ava-avashop-xray
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "2096"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  nginx_cache:
