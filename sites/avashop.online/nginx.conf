# avashop.online — Nginx: CDN separate from tunnel

proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:100m max_size=5g inactive=30d use_temp_path=off;

upstream shop_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream tunnel_backend {
    server 127.0.0.1:2096;
    keepalive 8;
}

# ─── CDN: avashop.online / www / de (Cloudflare Proxied) ───
server {
    listen 80;
    listen 443 ssl http2;
    server_name avashop.online www.avashop.online de.avashop.online;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only accept traffic from Cloudflare (optional hardening)
    # include /etc/nginx/cloudflare-ips.conf;

    location / {
        proxy_pass http://shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache cdn_cache;
        proxy_cache_valid 200 302 24h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-AVA-Layer "cdn-origin";
    }

    # VLESS-gRPC inbound path (Cloudflare CDN → Xray)
    location /grpc-avashop {
        grpc_pass grpc://xray:2096;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        add_header X-AVA-Layer "cdn-grpc-inbound";
    }

    location /api/ {
        proxy_pass http://shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header X-AVA-Layer "cdn-origin-api";
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass http://shop_backend;
        proxy_cache cdn_cache;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;
    }
}

# ─── TUNNEL: tunnel.avashop.online (DNS only — separate, no CDN) ───
server {
    listen 80;
    listen 443 ssl http2;
    server_name tunnel.avashop.online;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # No CDN cache — direct tunnel path
        proxy_cache off;
        add_header X-AVA-Layer "tunnel-direct";
    }
}

# ─── Default / health ───
server {
    listen 80 default_server;
    server_name _;
    location /health {
        access_log off;
        return 200 "avashop-cdn-ok\n";
        add_header Content-Type text/plain;
    }
    location / {
        return 444;
    }
}
